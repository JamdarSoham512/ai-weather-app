<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Assistant</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2196f3">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(to bottom right,#2196f3,#21cbf3);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .app{
            width:100%;
            max-width:420px;
            background:rgba(255,255,255,0.95);
            border-radius:20px;
            padding:25px;
            box-shadow:0 20px 40px rgba(0,0,0,0.2);
        }

        .header{
            text-align:center;
            margin-bottom:20px;
        }

        .header h1{
            font-size:26px;
            font-weight:600;
            color:#1976d2;
        }

        .header p{
            font-size:14px;
            color:#555;
        }

        .controls{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }

        .controls input{
            flex:1;
            padding:12px;
            border-radius:12px;
            border:1px solid #ccc;
            outline:none;
            font-size:14px;
        }

        .controls button{
            border:none;
            background:#2196f3;
            color:white;
            padding:10px 14px;
            border-radius:12px;
            cursor:pointer;
            font-size:14px;
        }

        .weather-box{
            background:linear-gradient(to bottom right,#e3f2fd,#bbdefb);
            border-radius:16px;
            padding:20px;
            text-align:center;
            margin-bottom:15px;
        }

        .city{
            font-size:20px;
            font-weight:600;
            color:#0d47a1;
        }

        .temp{
            font-size:48px;
            font-weight:600;
            margin:10px 0;
            color:#1565c0;
        }

        .info{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
            margin-bottom:15px;
        }

        .info-box{
            background:#f5f5f5;
            border-radius:12px;
            padding:10px;
            text-align:center;
        }

        .ai-box{
            background:linear-gradient(to right,#4caf50,#81c784);
            color:white;
            padding:15px;
            border-radius:14px;
            text-align:center;
            font-size:15px;
        }

        .chart-box{
            margin-top:15px;
            height:200px;
        }

        .footer{
            margin-top:15px;
            text-align:center;
            font-size:12px;
            color:#777;
        }

    </style>
</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">
        <h1>🌤️ AI Weather</h1>
        <p>Smart Weather Assistant</p>
    </div>

    <!-- Controls -->
    <div class="controls">
        <input id="city" type="text" placeholder="Enter city name">
        <button onclick="searchCity()">🔍</button>
        <button onclick="getLocation()">📍</button>
        <button onclick="startVoice()">🎤</button>
    </div>

    <!-- Weather -->
    <div class="weather-box">
        <div id="cityName" class="city">--</div>
        <div id="temperature" class="temp">-- °C</div>
        <div id="description">Weather Info</div>
    </div>

    <!-- Info -->
    <div class="info">

        <div class="info-box">
            <h4>Humidity</h4>
            <p id="humidity">--%</p>
        </div>

        <div class="info-box">
            <h4>Wind</h4>
            <p id="wind">-- km/h</p>
        </div>

        <div class="info-box">
            <h4>Pressure</h4>
            <p id="pressure">-- hPa</p>
        </div>

    </div>

    <!-- AI -->
    <div id="ai" class="ai-box">
        🤖 AI Prediction: --
    </div>

    <!-- Chart -->
    <div class="chart-box">
        <canvas id="weatherChart"></canvas>
    </div>

    <div class="footer">
        Powered by Open-Meteo
    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
